# Local RiadhaTrac broker. Copy this folder outside source control before adding
# the password file; the password file must never be committed.
persistence true
persistence_location F:/projects/ArduinoUnoProject/RiadhaTrack/backend/infra/mosquitto/data/
listener 1884
allow_anonymous false
password_file F:/projects/ArduinoUnoProject/RiadhaTrack/backend/infra/mosquitto/config/passwordfile
acl_file F:/projects/ArduinoUnoProject/RiadhaTrack/backend/infra/mosquitto/config/aclfile

# Use a firewall/local router to restrict access to the training LAN. Add TLS
# listener/certificate settings before traffic crosses an untrusted network.
